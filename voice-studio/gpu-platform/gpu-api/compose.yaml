services:
  voice-gpu:
    build: .
    restart: unless-stopped
    environment:
      VOICE_API_TOKEN: ${VOICE_API_TOKEN:?Set a strong server-side VOICE_API_TOKEN}
      VOICE_MODEL_VARIANT: ${VOICE_MODEL_VARIANT:-custom-1.7b}
      HF_HOME: /models/hf
    gpus: all
    volumes:
      - model_cache:/models/hf
    ports:
      - "127.0.0.1:8000:8000"
    shm_size: 2gb
    security_opt:
      - no-new-privileges:true
volumes:
  model_cache: